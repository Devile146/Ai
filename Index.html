<!DOCTYPE html>
<html lang="ur">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fahad ki Photo</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: Arial, sans-serif;
        }

        .container {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            text-align: center;
            max-width: 90%;
            transition: transform 0.3s ease;
        }

        .container:hover {
            transform: scale(1.02);
        }

        h1 {
            color: #333;
            margin-bottom: 20px;
            font-size: 2rem;
        }

        img {
            max-width: 100%;
            height: auto;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            border: 5px solid #fff;
            transition: all 0.3s ease;
        }

        img:hover {
            box-shadow: 0 15px 45px rgba(0,0,0,0.4);
        }

        .caption {
            margin-top: 20px;
            color: #555;
            font-size: 1.1rem;
            background: #f0f0f0;
            padding: 10px 20px;
            border-radius: 50px;
            display: inline-block;
        }

        .error-msg {
            color: red;
            padding: 20px;
            background: #ffe0e0;
            border-radius: 10px;
            display: none;
            margin-top: 20px;
        }

        .file-path {
            margin-top: 15px;
            padding: 10px;
            background: #f8f9fa;
            border-radius: 8px;
            font-size: 14px;
            color: #666;
            border: 1px dashed #ccc;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>👋 Fahad ki Tasveer</h1>
        
        <!--
            IMPORTANT: 
            Agar photo ROOT folder mein hai to ye line use karein:
        -->
        <img src="fahad.jpg" alt="Fahad ki Photo" id="myImage">
        
        <!--
            Agar photo IMAGES folder mein hai to ye line use karein:
            <img src="images/fahad.jpg" alt="Fahad ki Photo" id="myImage">
        -->
        
        <!--
            Agar photo ASSETS folder mein hai to ye line use karein:
            <img src="assets/fahad.jpg" alt="Fahad ki Photo" id="myImage">
        -->
        
        <div class="error-msg" id="errorMsg">
            ⚠️ Photo load nahi ho paayi! <br>
            <small>Yaqeen karein ke <strong>fahad.jpg</strong> sahi folder mein hai.</small>
        </div>
        
        <div class="caption">✨ Fahad bhai ki tasveer ✨</div>
        
        <!-- Current path dikhana (debugging ke liye) -->
        <div class="file-path" id="pathDisplay"></div>
    </div>

    <script>
        const img = document.getElementById('myImage');
        const errorDiv = document.getElementById('errorMsg');
        const pathDisplay = document.getElementById('pathDisplay');

        // Current image path show karna
        pathDisplay.textContent = '📂 Image path: ' + img.src;

        // Agar image load na ho
        img.onerror = function() {
            errorDiv.style.display = 'block';
            this.style.display = 'none';
            
            // Try alternative paths (auto-search)
            tryAlternativePaths();
        };

        // Agar image load ho
        img.onload = function() {
            errorDiv.style.display = 'none';
            this.style.display = 'block';
            console.log('✅ Photo loaded successfully!');
        };

        // Auto-search function (agar root mein na mile to subfolders check karein)
        function tryAlternativePaths() {
            const paths = [
                'images/fahad.jpg',
                'assets/fahad.jpg',
                'img/fahad.jpg',
                'photos/fahad.jpg',
                'pictures/fahad.jpg'
            ];
            
            let found = false;
            
            paths.forEach(function(path) {
                const testImg = new Image();
                testImg.onload = function() {
                    if (!found) {
                        img.src = path;
                        img.style.display = 'block';
                        errorDiv.style.display = 'none';
                        pathDisplay.textContent = '✅ Found at: ' + path;
                        found = true;
                        console.log('✅ Photo found in: ' + path);
                    }
                };
                testImg.src = path;
            });
        }
    </script>
</body>
  </html>
